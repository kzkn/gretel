name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile

    strategy:
      matrix:
        gemfile:
          - rails_61
          - rails_70
          - rails_71
          - rails_72
          - rails_80
          - rails_81
          - rails_main
        ruby_version:
          - '4.0'
          - '3.4'
          - '3.3'
          - '3.2'
          - '3.1'
        exclude:
          - { ruby_version: '3.1', gemfile: 'rails_main' }
          - { ruby_version: '3.2', gemfile: 'rails_main' }
          - { ruby_version: '3.1', gemfile: 'rails_81' }
          - { ruby_version: '3.1', gemfile: 'rails_80' }
          - { ruby_version: '3.4', gemfile: 'rails_61' }
          - { ruby_version: '3.4', gemfile: 'rails_70' }
          - { ruby_version: '4.0', gemfile: 'rails_61' }
          - { ruby_version: '4.0', gemfile: 'rails_70' }
          - { ruby_version: '4.0', gemfile: 'rails_71' }
          - { ruby_version: '4.0', gemfile: 'rails_72' }

    steps:
    - uses: actions/checkout@v6

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "${{ matrix.ruby_version }}"

    - name: Run test
      run: |
        gem update --system
        bundle update
        cd spec/dummy; rake db:migrate db:test:prepare; cd ../..
        bundle exec rake

    - name: Upload coverage
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: "coverage-ruby-${{ matrix.ruby_version }}-${{ matrix.gemfile }}"
        path: coverage

    - name: Show coverage
      if: always()
      run: |
        cat coverage/coverage.txt
